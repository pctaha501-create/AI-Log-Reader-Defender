name: Build release binaries
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ''
    runs-on: ${{ matrix.os ${{
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos ${{ GOARCH=${{ matrix.goarch ${{ CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "dist/ald-${{ matrix.goos ${{-${{ matrix.goarch ${{${{ matrix.ext ${{" ./cmd/ald
      - uses: actions/upload-artifact@v4
        with:
          name: ald-${{ matrix.goos ${{-${{ matrix.goarch ${{
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
