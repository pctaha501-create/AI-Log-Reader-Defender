name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Format Go source
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Test with race detector
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            filename: ald-windows-amd64.exe
          - name: Ubuntu Linux x64
            os: ubuntu-latest
            filename: ald-linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.filename }}" ./cmd/ald
      - name: Smoke test
        shell: bash
        run: |
          ./dist/${{ matrix.filename }} version
          ./dist/${{ matrix.filename }} analyze --input testdata/sample-events.jsonl
